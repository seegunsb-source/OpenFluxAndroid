name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git tag or branch to build"
        required: true
        default: "v2.6.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: p1neappleXpress/OpenFluxAndroid
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Install Android SDK and NDK
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build OpenFlux core
        run: bash scripts/build-android-core.sh

      - name: Test and build Debug APK
        run: |
          ./gradlew --no-daemon \
            :shared:jvmTest \
            :androidApp:assembleDebug

      - name: Collect APKs and checksums
        run: |
          set -e
          mkdir -p dist

          find androidApp/build/outputs/apk/debug \
            -type f -name '*.apk' -exec cp {} dist/ \;

          if ! find dist -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::No APK files found"
            exit 1
          fi

          cd dist
          sha256sum *.apk > SHA256SUMS.txt

          echo "Generated APK files:"
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenFluxAndroid-Debug-${{ inputs.source_ref }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
